name: Publicar OBS Manager

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar versión del tag
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          if ($packageVersion -ne $tagVersion) {
            throw "package.json ($packageVersion) no coincide con el tag ($tagVersion)"
          }

      - name: Compilar instalador
        run: |
          npm run build
          npx electron-builder --win nsis --publish never

      - name: Preparar archivos de actualización
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item "release\OBS Manager Setup $version.exe" "release\OBS-Manager-Setup-$version.exe"
          Copy-Item "release\OBS Manager Setup $version.exe.blockmap" "release\OBS-Manager-Setup-$version.exe.blockmap"

      - name: Publicar Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          gh release create "${{ github.ref_name }}" `
            --title "OBS Manager $version" `
            --notes "Actualización automática de OBS Manager $version." `
            "release\latest.yml" `
            "release\OBS-Manager-Setup-$version.exe" `
            "release\OBS-Manager-Setup-$version.exe.blockmap"
